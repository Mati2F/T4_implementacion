apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduled-messages-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduled-messages-scheduler
  template:
    metadata:
      labels:
        app: scheduled-messages-scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: ghcr.io/mati2f/scheduled-messages:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - python
            - -m
            - app.scheduler
          envFrom:
            - configMapRef:
                name: scheduled-messages-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: scheduled-messages-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi