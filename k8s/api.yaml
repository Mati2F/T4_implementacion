apiVersion: v1
kind: Service
metadata:
  name: scheduled-messages-api
spec:
  selector:
    app: scheduled-messages-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduled-messages-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduled-messages-api
  template:
    metadata:
      labels:
        app: scheduled-messages-api
    spec:
      containers:
        - name: api
          image: ghcr.io/mati2f/scheduled-messages:latest
          imagePullPolicy: Always
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: scheduled-messages-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: scheduled-messages-secrets
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scheduled-messages-api
spec:
  ingressClassName: traefik
  rules:
    - host: mensajes-programados.134.199.176.3.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scheduled-messages-api
                port:
                  number: 80