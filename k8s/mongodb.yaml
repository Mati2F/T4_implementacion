apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scheduled-messages-mongodb-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scheduled-messages-mongodb
spec:
  selector:
    app: scheduled-messages-mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduled-messages-mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scheduled-messages-mongodb
  template:
    metadata:
      labels:
        app: scheduled-messages-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: scheduled-messages-mongodb-data