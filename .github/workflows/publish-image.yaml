name: Publicar imagen Docker

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./scheduled-messages
            image: scheduled-messages
          - context: ./gateway
            image: chat-gateway
          - context: ./chat-frontend
            image: chat-frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/mati2f/${{ matrix.image }}:latest
            ghcr.io/mati2f/${{ matrix.image }}:${{ github.sha }}
