server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /graphql {
    # Deja pasar los archivos de hasta 10 MiB admitidos por Media y el multipart.
    client_max_body_size 12m;
    proxy_pass ${GATEWAY_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /media/ {
    proxy_pass ${GATEWAY_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los archivos con hash en el nombre se pueden cachear sin problema.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier otra ruta devuelve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
