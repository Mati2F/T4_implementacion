<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <style>
      html { background: #fff; color: #18181b; color-scheme: light; }
      html.dark { background: #09090b; color: #fafafa; color-scheme: dark; }
      body { margin: 0; }
    </style>
    <script>
      // Aplicar la preferencia antes de mostrar la interfaz evita un destello claro.
      (() => {
        let saved;
        try { saved = localStorage.getItem("chat.theme"); } catch { /* almacenamiento no disponible */ }
        const dark = saved === "dark" || (saved !== "light" && window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", !!dark);
        document.documentElement.classList.toggle("light", !dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
