services:
  chat-frontend:
    build:
      context: .
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-/graphql}
    environment:
      GATEWAY_UPSTREAM: http://chat-gateway:8000
    ports:
      - "3000:8080"
    restart: unless-stopped
    networks:
      - microsvcs

networks:
  microsvcs:
    name: microsvcs
    external: true
